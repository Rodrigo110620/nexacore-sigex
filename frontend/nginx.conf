# Si un proxy con HTTPS está delante (servidor del laboratorio), respeta su X-Forwarded-Proto.
map $http_x_forwarded_proto $proto_original {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Importación de estudiantes/usuarios por CSV.
    client_max_body_size 10m;

    # API: mismo dominio que el frontend, así no hace falta CORS.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Se sobrescribe (no se concatena): el rate limit del login toma la primera
        # IP de esta cabecera, y si se concatenara el cliente podría falsificarla.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $proto_original;
        # La importación masiva puede tardar varios minutos.
        proxy_read_timeout 300s;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché mucho tiempo.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta del frontend devuelve index.html.
    # no-cache: el navegador guarda index.html pero pregunta si cambió antes de usarlo. Así,
    # después de un despliegue carga la versión nueva sin que el usuario tenga que actualizar.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
