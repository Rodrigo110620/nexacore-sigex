spring:
  # Configuración de la Base de Datos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taller_TIS}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:dfigueroa}
    driver-class-name: org.postgresql.Driver

  # Configuración de JPA (Hibernate)
  jpa:
    hibernate:
      ddl-auto: update # Cambiar a 'validate' en el servidor de la universidad
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Configuración del Servidor Web (Tomcat Embebido)
server:
  port: ${SERVER_PORT:8080}

# Variables personalizadas para nuestra seguridad
app:
  security:
    jwt:
      secret: ${JWT_SECRET:default_secret_cambiar_en_produccion}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
