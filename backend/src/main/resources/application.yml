spring:
  profiles:
    active: ${DB_TARGET:docker}

  jpa:
    # Se registra a mano en OpenInViewConfig para excluir las notificaciones en vivo (SSE).
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      # Importación masiva: hasta 10 000 estudiantes por CSV (~0,8 MB); se deja margen.
      max-file-size: 5MB
      max-request-size: 6MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Tolera migraciones aplicadas cuyo archivo ya no existe (la V30 que estuvo en develop) y
    # las más nuevas que la rama actual. Una migración EDITADA sí detiene el arranque.
    ignore-migration-patterns: "*:missing,*:future"

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 4000
          timeout: 4000
          writetimeout: 4000

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
  # Detrás de nginx/HTTPS: respeta X-Forwarded-Proto
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

app:
  flyway:
    # true solo para alinear checksums a propósito (p. ej. tras el cambio de aea230f en una base
    # que no arrancó desde entonces). Si está siempre activo, oculta migraciones editadas.
    reparar-al-iniciar: ${FLYWAY_REPARAR:false}
  security:
    jwt:
      # Sin default: si falta JWT_SECRET en .env, la app no arranca.
      secret: ${JWT_SECRET}
      # 8 horas, como pide la HU AUTH-02
      expiration-ms: ${JWT_EXPIRATION_MS:28800000}
    qr:
      # Clave para cifrar los QR de los estudiantes. Opcional: si falta, se usa JWT_SECRET.
      # Definirla permite cambiar JWT_SECRET sin invalidar los QR ya enviados. Una vez
      # definida, no se cambia: los QR existentes dejarían de servir.
      secret: ${QR_SECRET:}
    # Bloqueo de la cuenta tras intentos fallidos seguidos (HU AUTH-02)
    login:
      max-intentos: ${LOGIN_MAX_INTENTOS:3}
      minutos-bloqueo: ${LOGIN_MINUTOS_BLOQUEO:15}
    # true en producción para cerrar Swagger
    swagger-enabled: ${SWAGGER_ENABLED:true}
    # true solo detrás de HTTPS (proxy TLS). En local déjalo false.
    require-https: ${REQUIRE_HTTPS:false}
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      max-requests: ${AUTH_RATE_LIMIT_MAX:10}
      window-ms: ${AUTH_RATE_LIMIT_WINDOW_MS:60000}
  cors:
    # Orígenes exactos opcionales (coma-separados).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # Default: solo localhost. Para móvil/LAN añade patterns en .env.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:noreply@sigex.local}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
  # Respaldo de la base con pg_dump (IMP-10). El laboratorio no respalda las bases de los grupos.
  # El ADMIN lo descarga en Configuración. El respaldo automático nocturno queda apagado: solo se
  # activa si el laboratorio carga RESPALDO_DIR apuntando a un volumen persistente (no se puede
  # agregar en docker-compose.yml, que el laboratorio no permite modificar).
  respaldo:
    directorio: ${RESPALDO_DIR:}
    cron: ${RESPALDO_CRON:0 0 3 * * *}
    conservar: ${RESPALDO_CONSERVAR:7}
    pg-dump: ${RESPALDO_PG_DUMP:pg_dump}
    minutos-maximos: ${RESPALDO_MINUTOS_MAXIMOS:10}
