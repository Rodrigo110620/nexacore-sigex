spring:
  datasource:
    # clock_timestamp() de PostgreSQL no existe en H2: se agrega como función para las pruebas.
    url: "jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE ALIAS IF NOT EXISTS CLOCK_TIMESTAMP FOR 'com.nexacore.examenes.FuncionesH2.clockTimestamp'\\;CREATE ALIAS IF NOT EXISTS TIMEZONE FOR 'com.nexacore.examenes.FuncionesH2.timezone'"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 25
    username: test
    password: test

app:
  security:
    jwt:
      secret: test_secret_key_muy_larga_para_que_pase_la_validacion_de_longitud_minima
    swagger-enabled: true
    require-https: false
    rate-limit:
      enabled: false
  mail:
    enabled: false
    from: test@sigex.local
