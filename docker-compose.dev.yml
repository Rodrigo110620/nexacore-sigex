# ==========================================
# SIGEX — entorno de DESARROLLO
# Solo la base de datos y pgAdmin; el backend y el frontend se corren en tu máquina
# (./mvnw spring-boot:run y pnpm dev) para tener recarga en caliente.
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Para el despliegue (base + backend + frontend) se usa docker-compose.yml.
# ==========================================
# Mismo nombre de proyecto que antes: reconoce los contenedores y la base que ya tenías.
name: nexacore-sigex

services:
  db:
    image: postgres:15.10
    container_name: nexacore_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DOCKER_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD:?Define DOCKER_DB_PASSWORD en .env}
      POSTGRES_DB: ${DOCKER_DB_NAME:-taller_TIS}
    ports:
      - "${DOCKER_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nexacore_net

  pgadmin:
    image: dpage/pgadmin4
    container_name: nexacore_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@nexacore.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Define PGADMIN_PASSWORD en .env}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    networks:
      - nexacore_net

volumes:
  # Mismo volumen que usaba el docker-compose.yml anterior: se conservan los datos de desarrollo.
  pgdata:
    name: nexacore-sigex_pgdata

networks:
  nexacore_net:
    driver: bridge
