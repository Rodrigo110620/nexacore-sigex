name: sigex

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    build: ./backend
    container_name: sigex_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_TARGET: docker
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DOCKER_DB_HOST: ${DB_HOST}
      DOCKER_DB_PORT: ${DB_PORT:-5432}
      SERVER_PORT: "8080"
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging: *logging
    networks:
      - sigex_net
      - coolify

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: sigex_frontend
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    logging: *logging
    networks:
      - sigex_net
      - coolify

networks:
  sigex_net:
    driver: bridge
  coolify:
    external: true
