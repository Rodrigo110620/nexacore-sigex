version: '3.8'
services:
  db:
    image: postgres:15.10
    container_name: nexacore_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dfigueroa
      POSTGRES_DB: taller_TIS
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
